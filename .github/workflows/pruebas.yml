name: Pruebas

on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline-eps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      # Los PDF de prueba no se versionan (son contenido de cada EPS). Se guardan en caché un mes
      # para no pedirlos a las EPS en cada push.
      - id: mes
        run: echo "mes=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: pipeline/eps/tests/fixtures/*.pdf
          key: fixtures-eps-${{ hashFiles('pipeline/eps/tests/fixtures/fixtures.json') }}-${{ steps.mes.outputs.mes }}
      - run: python -m pipeline.eps.tests.bajar_fixtures
      - run: python -m pytest pipeline/eps/tests -q
        env:
          REQUIRE_FIXTURES: "1"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
